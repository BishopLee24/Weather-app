<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================
         Meta Configuration
    ========================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- =========================
         Page Title
    ========================== -->

    <title>Weather App</title>

    <!-- =========================
         External CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =========================
         Main Application
    ========================== -->

    <main class="container">

        <!-- =========================
             Application Heading
        ========================== -->

        <h1>Weather App</h1>


        <!-- =========================
             Search Section
        ========================== -->

        <section class="search-section">

            <input
                type="text"
                id="city-input"
                placeholder="Enter city name"
            >

            <button id="search-btn">
                Search
            </button>

            <button id="unit-toggle-btn">
                Switch to °F
            </button>

            <button id="theme-toggle-btn">
                Toggle Dark Mode
            </button>

        </section>


        <!-- =========================
             Current Weather
        ========================== -->

        <section id="weather-info"></section>


        <!-- =========================
             Forecast Section
        ========================== -->

        <section class="forecast-section">

            <h2 class="forecast-title">
                5-Day Forecast
            </h2>

            <div id="forecast"></div>

        </section>


        <!-- =========================
             Search History
        ========================== -->

        <section id="search-history">

            <h2 class="history-title">
                Recent Searches
            </h2>

            <ul id="history-list"></ul>

            <button id="clear-history-btn">
                Clear History
            </button>

        </section>

    </main>

    <!-- =========================
         External JavaScript
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
